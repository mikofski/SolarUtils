name: Upload Python Package

on:
  push:
    tags:
      - 'v*'  # trigger on versioned tags

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py sdist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists-sdist
          path: dist/

  release-matrix:
    strategy:
      matrix:
        pyver: [10, 11, 12, 13, 14]
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.${{ matrix.pyver }}"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py bdist_wheel

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists-${{ matrix.os }}-py${{ matrix.pyver }}
          path: dist/


  gh-publish:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: release-matrix
    permissions:
      contents: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: release-dists-*
          merge-multiple: true
      - run: ls -R dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          files: dist/*

  pypi-publish:
    name: publish PyPI release
    runs-on: ubuntu-latest
    needs:
      - release-build
      - release-matrix
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/solarutils

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: release-dists-*
          merge-multiple: true

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  testpypi-publish:
    name: publish TestPyPI release
    runs-on: ubuntu-latest
    needs:
      - release-build
      - release-matrix

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    environment:
      name: testpypi
      url: https://test.pypi.org/p/solarutils

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: release-dists-*
          merge-multiple: true

      - name: Publish release distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/solarutils/
          packages-dir: dist/
