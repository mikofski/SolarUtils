name: Upload Python Package

on:
  push:
    tags:
      - 'v*'  # trigger on versioned tags

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py sdist

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists-sdist
          path: dist/

  release-matrix:
    strategy:
      matrix:
        pyver: [10, 11, 12, 13, 14]
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.${{ matrix.pyver }}"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python setup.py bdist_wheel

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists-${{ matrix.os }}-py${{ matrix.pyver }}
          path: dist/

  gh-publish:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs: release-matrix
    permissions:
      contents: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: release-dists-*
          merge-multiple: true
      - run: ls -R dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: ${{ github.ref_name }}
          files: dist/*

  pypi-publish:
    name: publish PyPI release
    runs-on: ubuntu-latest
    needs:
      - release-build
      - release-matrix
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/SolarUtils

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: release-dists-*
          merge-multiple: true

      - name: Filter out unsupported Linux wheels for PyPI
        run: |
          mkdir -p dist-pypi
          cp dist/*.tar.gz dist-pypi/ || true
          cp dist/*manylinux*.whl dist-pypi/ || true
          cp dist/*macosx*.whl dist-pypi/ || true
          cp dist/*win*.whl dist-pypi/ || true
          echo "Will upload:"
          ls -1 dist-pypi

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/

  testpypi-publish:
    name: publish TestPyPI release
    runs-on: ubuntu-latest
    needs:
      - release-build
      - release-matrix

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    environment:
      name: testpypi
      url: https://test.pypi.org/p/SolarUtils

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: release-dists-*
          merge-multiple: true

      - name: Filter out unsupported Linux wheels for TestPyPI
        run: |
          mkdir -p dist-testpypi
          cp dist/*.tar.gz dist-testpypi/ || true
          cp dist/*manylinux*.whl dist-testpypi/ || true
          cp dist/*macosx*.whl dist-testpypi/ || true
          cp dist/*win*.whl dist-testpypi/ || true
          echo "Will upload:"
          ls -1 dist-testpypi

      - name: Publish release distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-testpypi/

  docs-publish:
    name: publish documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build docs
        run: |
          python -m pip install --upgrade pip setuptools wheel sphinx
          sphinx-build -b html solar_utils/docs solar_utils/docs/_build

      - name: GitHub Pages action
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: solar_utils/docs/_build
